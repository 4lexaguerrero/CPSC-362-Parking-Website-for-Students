<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <header class="site_header">
      <div class="inner_header">
        <a href="/" class="title1">Titan Spot Watch</a>
        <nav class="nav_links">
          <a href="/login" class="loginbtn">Log in</a>
          <a href="/signup" class="signupbtn">Sign up</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="auth_wrap">
        <form class="auth_card" id="login-form" method="post" action="/login">
          <h1>Welcome Back</h1>
          <p class="auth1">Log in to see live counts and report where you parked</p>

          {% if success_message %}
          <p role="status">{{ success_message }}</p>
          {% endif %}
          {% if error_message %}
          <p role="alert">{{ error_message }}</p>
          {% endif %}

          <div class="form_group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required autocomplete="email" />
          </div>

          <div class="form_group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password" />
          </div>

          <button type="submit" class="authbtn">Log in</button>

          <p class="auth_switch">Don't have an account? <a href="/signup">Sign up</a></p>
        </form>
      </section>
    </main>

    <footer class="site_footer">
      <div class="inner_footer">
        <p>Built by CSUF students for CSUF students</p>
      </div>
    </footer>
  </body>
</html>
